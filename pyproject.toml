[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "face-detection-opencv"
version = "1.0.0"
description = "Local, consent-based face enrolment and one-to-one verification with OpenCV"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{name = "Oageng Kunene"}]
dependencies = [
  "opencv-python-headless==5.0.0.93",
  "numpy==2.5.4",
  "cryptography==50.0.2",
  "Pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.4", "build==1.6.1"]

[project.scripts]
face-detection = "bioguard.cli:main"
bioguard = "bioguard.cli:main"

[tool.setuptools.packages.find]
include = ["bioguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires downloaded OpenCV models and explicit test images"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
